{% extends 'index.html' %}{% block content %}{% load i18n %}{% load static %}

<section class="oh-wrapper oh-main__topbar">
  <div class="oh-main__titlebar oh-main__titlebar--left">
    <h1 class="oh-main__titlebar-title fw-bold">{% trans "Controllo Acconti" %}</h1>
  </div>
  <div class="oh-main__titlebar-button-container">
    <a href="{% url 'controllo-cedolini' %}" class="oh-btn oh-btn--light oh-btn--sm">
      <ion-icon name="arrow-back-outline" class="mr-1"></ion-icon>
      {% trans "Torna al Controllo" %}
    </a>
  </div>
</section>

<div class="oh-wrapper mt-4">
  <div class="oh-card" style="max-width:560px; margin:auto;">
    <div class="oh-card__body text-center py-5">
      <ion-icon name="construct-outline" style="font-size:3rem;color:#6f42c1;"></ion-icon>
      <h4 class="mt-3 fw-bold">{% trans "In fase di sviluppo" %}</h4>
      <p class="text-muted">
        {% trans "Il controllo acconti sarà disponibile a breve." %}
      </p>
    </div>
  </div>
</div>

{% endblock %}
