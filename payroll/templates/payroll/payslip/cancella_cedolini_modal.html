{% load i18n %}
<div class="oh-modal__content">
  <div class="oh-modal__header">
    <h3 class="oh-modal__title">
      <ion-icon name="trash-outline" style="color:#c0392b; vertical-align:middle;"></ion-icon>
      {% trans "Cancella Cedolini" %}
    </h3>
    <button type="button" class="oh-modal__close" data-toggle="oh-modal-toggle" data-target="#objectCreateModal">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <div class="oh-modal__body">

    <div id="cancellaCedoliniFormArea">
      <form
        id="cancellaCedoliniForm"
        hx-post="{% url 'cancella-cedolini' %}"
        hx-target="#cancellaCedoliniResultArea"
        hx-swap="innerHTML"
        hx-on::before-request="cancellaCedoliniBeforeRequest()"
        hx-on::after-request="cancellaCedoliniAfterRequest()"
      >
        {% csrf_token %}

        <!-- Mese -->
        <div class="oh-input-wrapper mb-3">
          <label class="oh-label" for="cancella_mese">
            {% trans "Mese" %} <span class="oh-asterisk">*</span>
          </label>
          <select class="oh-select oh-select-2" id="cancella_mese" name="mese" required
                  onchange="cancellaAggiornaSelezione()">
            <option value="">— {% trans "Seleziona mese" %} —</option>
            {% for cod, nome in mesi %}
              <option value="{{ cod }}">{{ nome }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Anno -->
        <div class="oh-input-wrapper mb-3">
          <label class="oh-label" for="cancella_anno">
            {% trans "Anno" %} <span class="oh-asterisk">*</span>
          </label>
          <select class="oh-select oh-select-2" id="cancella_anno" name="anno" required
                  onchange="cancellaAggiornaSelezione()">
            <option value="">— {% trans "Seleziona anno" %} —</option>
            {% for a in anni %}
              <option value="{{ a }}">{{ a }}</option>
            {% endfor %}
          </select>
          {% if not anni %}
            <small class="oh-helper-text text-muted">{% trans "Nessun dato presente nel database." %}</small>
          {% endif %}
        </div>

        <!-- Dipendente (opzionale) -->
        <div class="oh-input-wrapper mb-3">
          <label class="oh-label" for="cancella_matricola">
            {% trans "Dipendente" %}
            <small class="text-muted">({% trans "lasciare vuoto per tutti" %})</small>
          </label>
          <select class="oh-select oh-select-2" id="cancella_matricola" name="matricola"
                  onchange="cancellaAggiornaSelezione()">
            <option value="">— {% trans "Tutti i dipendenti" %} —</option>
            {% for d in dipendenti %}
              <option value="{{ d.matricola }}">{{ d.matricola }} — {{ d.nome }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Riepilogo selezione -->
        <div id="cancellaRiepilogo" class="oh-alert oh-alert--warning" style="display:none;">
          <ion-icon name="warning-outline"></ion-icon>
          <span id="cancellaRiepilogoTesto"></span>
        </div>

        <!-- Progress (nascosta) -->
        <div id="cancellaProgressWrapper" style="display:none;" class="mt-3">
          <p class="text-center mb-1" style="font-size:0.85rem; color:#555;">
            <ion-icon name="sync-outline" style="animation: spin 1s linear infinite; display:inline-block; vertical-align:middle;"></ion-icon>
            {% trans "Cancellazione in corso…" %}
          </p>
          <div style="background:#e9ecef; border-radius:4px; height:8px; overflow:hidden;">
            <div id="cancellaProgressBar"
                 style="height:100%; width:0%; background:#c0392b; border-radius:4px; transition: width 0.3s ease;">
            </div>
          </div>
        </div>

        <div class="oh-modal__footer mt-3 d-flex" style="gap:8px;">
          <button
            type="submit"
            class="oh-btn oh-btn--danger"
            id="cancellaSubmitBtn"
            disabled
          >
            <ion-icon name="trash-outline"></ion-icon>
            {% trans "Cancella" %}
          </button>
          <button
            type="button"
            class="oh-btn oh-btn--light"
            data-toggle="oh-modal-toggle"
            data-target="#objectCreateModal"
          >
            {% trans "Annulla" %}
          </button>
        </div>
      </form>
    </div>

    <!-- Risultato HTMX -->
    <div id="cancellaCedoliniResultArea"></div>

  </div>
</div>

<style>
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .oh-btn--danger {
    background-color: #c0392b !important;
    color: #fff !important;
    border-color: #c0392b !important;
  }
  .oh-btn--danger:hover { background-color: #a93226 !important; }
</style>

<script>
  var _cancellaProgressInterval = null;

  function cancellaAggiornaSelezione() {
    var mese  = document.getElementById("cancella_mese").value;
    var anno  = document.getElementById("cancella_anno").value;
    var mat   = document.getElementById("cancella_matricola");
    var matVal = mat ? mat.value : "";
    var btn   = document.getElementById("cancellaSubmitBtn");
    var riepilogo = document.getElementById("cancellaRiepilogo");
    var riepilogoTesto = document.getElementById("cancellaRiepilogoTesto");

    if (mese && anno) {
      btn.disabled = false;
      var nomeMese = document.getElementById("cancella_mese").options[document.getElementById("cancella_mese").selectedIndex].text;
      var nomeDip  = matVal
        ? (mat.options[mat.selectedIndex].text)
        : "{% trans 'tutti i dipendenti' %}";
      riepilogoTesto.textContent = "{% trans 'Verranno eliminate tutte le buste paga di' %} " + nomeMese + " " + anno + " {% trans 'per' %} " + nomeDip + ".";
      riepilogo.style.display = "flex";
    } else {
      btn.disabled = true;
      riepilogo.style.display = "none";
    }
  }

  function cancellaCedoliniBeforeRequest() {
    document.getElementById("cancellaSubmitBtn").disabled = true;
    document.getElementById("cancellaProgressWrapper").style.display = "block";
    var bar = document.getElementById("cancellaProgressBar");
    var w = 0;
    _cancellaProgressInterval = setInterval(function() {
      if (w < 80) { w += 5; bar.style.width = w + "%"; }
    }, 150);
  }

  function cancellaCedoliniAfterRequest() {
    clearInterval(_cancellaProgressInterval);
    document.getElementById("cancellaProgressBar").style.width = "100%";
    document.getElementById("cancellaProgressWrapper").style.display = "none";
    document.getElementById("cancellaCedoliniFormArea").style.display = "none";
  }

  function cancellaCedoliniReset() {
    document.getElementById("cancellaCedoliniFormArea").style.display = "block";
    document.getElementById("cancellaCedoliniResultArea").innerHTML = "";
    document.getElementById("cancellaSubmitBtn").disabled = true;
    document.getElementById("cancella_mese").value = "";
    document.getElementById("cancella_anno").value = "";
    var mat = document.getElementById("cancella_matricola");
    if (mat) mat.value = "";
    document.getElementById("cancellaRiepilogo").style.display = "none";
  }
</script>
