services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${DOCKER_PORT:-8000}:8000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro Docker il DB è raggiunto tramite il nome del servizio "db"
      DB_HOST: db
      # I media dentro il container sono montati in /app/media
      MEDIA_ROOT: /app/media/
    command: sh ./entrypoint.sh
    volumes:
      - ./horilla:/app/horilla
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-bullseye
    environment:
      POSTGRES_DB: ${DB_NAME:-horilla_main}
      POSTGRES_USER: ${DB_USER:-horilla}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    restart: unless-stopped
    volumes:
      - horilla-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-horilla}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  horilla-data:
