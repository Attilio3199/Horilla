services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${DOCKER_PORT:-8000}:8000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Il container raggiunge il DB locale tramite host.docker.internal
      DB_HOST: host.docker.internal
      # I media dentro il container sono montati in /app/media
      MEDIA_ROOT: /app/media/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh ./entrypoint.sh
    volumes:
      - ./horilla:/app/horilla
      - ./media:/app/media
