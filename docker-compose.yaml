services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:17
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGHOST: db
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DB_DUMP_PATH:-./horilla_main.dump}:/horilla_main.dump:ro
    command: >
      bash -c "
        if [ ! -f /horilla_main.dump ]; then
          echo 'No dump file found, skipping restore (fresh database).';
        elif psql -U \"$$DB_USER\" -d \"$$DB_NAME\" -c 'SELECT 1 FROM django_migrations LIMIT 1' > /dev/null 2>&1; then
          echo 'Database already initialized, skipping restore.';
        else
          echo 'Restoring database from dump...';
          pg_restore --no-privileges --no-owner -U \"$$DB_USER\" -d \"$$DB_NAME\" /horilla_main.dump || { echo 'pg_restore failed!'; exit 1; };
          echo 'Database restore complete.';
        fi
      "

  server:
    build:
      context: .
      dockerfile: Dockerfile
    # Porta 8000 non esposta direttamente: il traffico passa da nginx
    # TODO: quando si aggiunge un dominio, aggiornare CSRF_TRUSTED_ORIGINS nel .env
    expose:
      - "8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      MEDIA_ROOT: /app/media/
    depends_on:
      db-init:
        condition: service_completed_successfully
    command: sh ./entrypoint.sh
    volumes:
      - ./horilla:/app/horilla
      - /app/horilla/locale
      - ./media:/app/media

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs
    # Genera il certificato self-signed al primo avvio se non esiste.
    # TODO: quando sarà disponibile un dominio, rimuovere questo comando e
    #       montare i certificati Let's Encrypt al posto di nginx_certs.
    command: >
      sh -c "
        if [ ! -f /etc/nginx/certs/selfsigned.crt ]; then
          apk add --no-cache openssl &&
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048
            -keyout /etc/nginx/certs/selfsigned.key
            -out /etc/nginx/certs/selfsigned.crt
            -subj '/CN=horilla/O=Horilla/C=IT';
        fi &&
        nginx -g 'daemon off;'
      "

volumes:
  postgres_data:
  nginx_certs:
